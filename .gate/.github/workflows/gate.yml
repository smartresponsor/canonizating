name: gate

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run gate (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./.gate/gate.sh
          ./.gate/gate.sh .

      - name: Run owner gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.gate/gate.ps1 -Path .

      - name: gate fix proposal (print)
        if: always()
        shell: pwsh
        run: |
          pwsh -File .\.gate\contract\ps1\fail-fixer-run.ps1 -RepoRoot . -PrintOnly

codex-dispatch:
  name: codex-dispatch
  runs-on: ubuntu-latest
  needs: gate
  if: failure()
  permissions:
    contents: read
    issues: write
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Create issue for Codex
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = '.report/gate-fix-proposal.ndjson';
          
          if (!fs.existsSync(path)) {
            console.log('No proposal file found:', path);
            return;
          }
          
          const proposal = fs.readFileSync(path, 'utf8').trim();
          const title = `gate: fix required (${context.repo.owner}/${context.repo.repo})`;
          const body = [
            'Gate failed.',
            '',
            'Proposal NDJSON:',
            '```',
            proposal || '(empty)',
            '```',
            '',
            `Ref: ${context.sha}`,
          ].join('\n');
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body,
            labels: ['codex', 'gate-fail'],
          });
